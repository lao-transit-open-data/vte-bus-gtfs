<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Route 13 - Vientiane City Bus</title>
    <style>
        :root {
            --bus-green: #34c759;
            --apple-bg: #f5f5f7;
            --glass: rgba(255, 255, 255, 0.8);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--apple-bg);
            margin: 0; padding: 20px; color: #1d1d1f;
            display: flex; flex-direction: column; align-items: center;
        }
        .card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 24px;
            width: 100%; max-width: 400px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.3);
        }
        .header { text-align: center; margin-bottom: 20px; }
        .bus-badge {
            background: var(--bus-green); color: white;
            padding: 4px 12px; border-radius: 50px; font-weight: bold; font-size: 0.9rem;
        }
        h1 { font-size: 1.5rem; margin: 10px 0; font-weight: 700; }
        .route-path { font-size: 0.85rem; color: #86868b; margin-bottom: 20px; line-height: 1.4; }
        .fare-box {
            background: rgba(52, 199, 89, 0.1);
            padding: 15px; border-radius: 15px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th { text-align: left; color: #86868b; font-weight: 500; padding: 10px 5px; border-bottom: 1px solid #d2d2d7; }
        td { padding: 12px 5px; border-bottom: 1px solid #f2f2f7; }
        .footer { margin-top: 20px; font-size: 0.75rem; color: #86868b; text-align: center; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <span class="bus-badge">City Bus</span>
            <h1 id="route-name">Loading...</h1>
            <p class="route-path" id="route-path">Please wait while we fetch the latest transit data.</p>
        </div>

        <div class="fare-box">
            <span style="font-weight: 600;">Fare / ຄ່າໂດຍສານ</span>
            <span style="color: var(--bus-green); font-weight: 700; font-size: 1.1rem;">
                <span id="fare-price">--</span> LAK
            </span>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Departure</th>
                    <th>Terminal</th>
                    <th>Arrival</th>
                </tr>
            </thead>
            <tbody id="timetable-body">
                <tr>
                    <td colspan="4" style="text-align:center; padding:30px; color:#86868b;">Fetching timetable...</td>
                </tr>
            </tbody>
        </table>

        <div class="footer">
            Lao Transit Open Data Project<br>
            Last Updated: <span id="update-date">--</span>
        </div>
    </div>

    <script>
        
        const API_BASE = '../../api/v1'; 
        const ROUTE_DATA = `${API_BASE}/bus-data/13.json`;
        const CONFIG_DATA = `${API_BASE}/config.json`;

        async function fetchTransitData() {
            try {
                
                const [configRes, routeRes] = await Promise.all([
                    fetch(CONFIG_DATA),
                    fetch(ROUTE_DATA)
                ]);

                const config = await configRes.json();
                const route = await routeRes.json();

                
                document.getElementById('route-name').innerText = route.name;
                document.getElementById('route-path').innerText = route.path;
                document.getElementById('fare-price').innerText = config.global_fares.bus_standard.toLocaleString();
                document.getElementById('update-date').innerText = config.last_updated;

                
                const tbody = document.getElementById('timetable-body');
                tbody.innerHTML = route.timetable.map(trip => `
                    <tr>
                        <td style="color:var(--bus-green); font-weight:600">${trip.id}</td>
                        <td>${trip.d}</td>
                        <td>${trip.t}</td>
                        <td>${trip.a}</td>
                    </tr>
                `).join('');

            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('timetable-body').innerHTML = 
                    '<tr><td colspan="4" style="text-align:center; color:#ff3b30;">Failed to load. Please refresh.</td></tr>';
            }
        }

        window.onload = fetchTransitData;
    </script>
</body>
</html>
