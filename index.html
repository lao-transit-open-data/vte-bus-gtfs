<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <title>Bus.Slowork.la | Digital Twin Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
        body { background: #050505; color: #00FF41; font-family: 'Space Mono', monospace; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; }
    </style>
</head>
<body class="h-screen flex flex-col p-4 overflow-hidden">
    <header class="mb-6 flex justify-between items-center border-b border-green-900/50 pb-4">
        <div>
            <h1 class="text-xl font-bold tracking-tighter uppercase">VTE-Transit Digital Twin</h1>
            <p class="text-[10px] text-blue-400">STATUS: CONNECTED TO GITHUB_PAGES</p>
        </div>
        <div id="clock" class="text-xl font-bold">00:00:00</div>
    </header>

    <main class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-4 overflow-hidden">
        <section class="glass p-4 flex flex-col overflow-hidden">
            <h2 class="text-[10px] opacity-50 mb-2 uppercase">Live_Event_Stream</h2>
            <div id="terminal" class="flex-1 overflow-y-auto text-[11px] space-y-1 pr-2">
                <div class="text-blue-400">>> Initializing connection to GitHub Pages...</div>
            </div>
        </section>

        <section id="card-container" class="space-y-3 overflow-y-auto pr-2">
            <!-- Active Bus Cards appear here -->
        </section>
    </main>

    <script>
        // 1. ປ່ຽນ URL ນີ້ໃຫ້ເປັນ URL ທີ່ໄດ້ຈາກ GitHub Pages 
        const PAGES_URL = "https://lao-transit-open-data.github.io/vte-bus-gtfs/";
        
        const terminal = document.getElementById('terminal');
        const cardContainer = document.getElementById('card-container');

        function addLog(msg, color = "text-white") {
            const div = document.createElement('div');
            div.className = color;
            div.innerHTML = `<span class="opacity-30">[${new Date().toLocaleTimeString()}]</span> ${msg}`;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        async function fetchGTFS(file) {
            const res = await fetch(`${PAGES_URL}${file}?t=${Date.now()}`);
            if (!res.ok) throw new Error(`HTTP_${res.status} file: ${file}`);
            return await res.text();
        }

        function parseCSV(text) {
            const lines = text.split('\n').filter(l => l.trim() !== "");
            const headers = lines[0].split(',').map(h => h.trim());
            return lines.slice(1).map(line => {
                const values = line.split(',');
                return headers.reduce((obj, header, i) => {
                    obj[header] = values[i] ? values[i].trim() : null;
                    return obj;
                }, {});
            });
        }

        async function startSystem() {
            try {
                addLog("FETCHING: trips.txt", "text-blue-400");
                const trips = parseCSV(await fetchGTFS("trips.txt"));
                addLog(`SUCCESS: Loaded ${trips.length} routes.`, "text-green-500");

                addLog("FETCHING: stop_times.txt", "text-blue-400");
                const stopTimes = parseCSV(await fetchGTFS("stop_times.txt"));
                addLog(`SUCCESS: Loaded ${stopTimes.length} stop schedules.`, "text-green-500");

                // Start Live Scanning
                setInterval(() => {
                    const now = new Date().toLocaleTimeString('en-GB', { 
                        timeZone: 'Asia/Vientiane', 
                        hour12: false 
                    });

                    const arrivals = stopTimes.filter(s => s.arrival_time === now);
                    arrivals.forEach(item => {
                        const trip = trips.find(t => t.trip_id === item.trip_id);
                        const route = trip ? trip.route_id : "BUS";
                        addLog(`MATCH: Route ${route} >> ${item.stop_id}`, "text-yellow-400");
                        renderCard(route, item);
                    });
                }, 1000);

            } catch (err) {
                addLog(`CRITICAL: ${err.message}`, "text-red-500");
            }
        }

        function renderCard(route, data) {
            const id = `card-${route.replace(/\s/g, '-')}`;
            let card = document.getElementById(id);
            if (!card) {
                card = document.createElement('div');
                card.id = id;
                card.className = "glass p-4 border-l-2 border-green-500 mb-2";
                cardContainer.prepend(card);
            }
            card.innerHTML = `
                <div class="flex justify-between text-[9px] opacity-50 mb-1">
                    <span>ROUTE: ${route}</span>
                    <span>TRIP: ${data.trip_id}</span>
                </div>
                <div class="text-sm font-bold">Arrived at: ${data.stop_id}</div>
                <div class="mt-2 h-1 bg-white/10 rounded-full overflow-hidden">
                    <div class="h-full bg-green-500 w-full animate-pulse"></div>
                </div>
            `;
        }

        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-GB', { timeZone: 'Asia/Vientiane' });
        }, 1000);

        window.onload = startSystem;
    </script>
</body>
</html>
